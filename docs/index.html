<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VirAliNet</title>
    <script src="./shinylive/load-shinylive-sw.js" type="module"></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />

    <style>
      #custom-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: sans-serif;
        color: #333;
      }

      #custom-loader p {
        margin: 0;
        font-size: 15px;
        color: #555;
      }

      #custom-loader p:first-of-type {
        font-size: 17px;
        color: #111;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e0e0e0;
        border-top-color: #7B8A8B;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #custom-loader.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>

    <div id="custom-loader">
      <div class="spinner"></div>
      <p><strong>Initializing VirAliNet...</strong></p>
      <p>Please wait, this may take a couple of minutes.</p>
    </div>

    <div style="height: 100vh; width: 100vw" id="root"></div>

    <<script>
  (function () {
    const loader = document.getElementById("custom-loader");

    function hideLoader() {
      loader.classList.add("hidden");
      setTimeout(() => loader.remove(), 450);
    }

    // Wait for the explicit "appReady" message sent by session$sendCustomMessage
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "appReady") {
        hideLoader();
      }
    });

    // Hard fallback: hide after 5 minutes no matter what
    setTimeout(hideLoader, 300000);
  })();
</script>

  </body>
</html>
